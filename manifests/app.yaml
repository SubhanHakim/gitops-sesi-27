---
# ==========================================
# 1. RESOURCE UNTUK SIMPLE-NGINX
# ==========================================

# ConfigMap NGINX
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-index-html
  namespace: default
data:
  index.html: "Ini tampilan dari NGINX dan nama saya Subhan Nur Iqbal Hakim"

---
# Deployment NGINX
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-nginx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-nginx
  template:
    metadata:
      labels:
        app: simple-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html-volume
          configMap:
            name: nginx-index-html

---
# Service NGINX (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: simple-nginx-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: simple-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

---
# ==========================================
# 2. RESOURCE UNTUK SIMPLE-HTTPD
# ==========================================

# ConfigMap HTTPD
apiVersion: v1
kind: ConfigMap
metadata:
  name: httpd-index-html
  namespace: default
data:
  index.html: "Ini tampilan dari HTTPD dan nama saya Subhan Nur Iqbal Hakim"

---
# Deployment HTTPD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-httpd
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-httpd
  template:
    metadata:
      labels:
        app: simple-httpd
    spec:
      containers:
        - name: httpd
          image: httpd:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/local/apache2/htdocs/index.html
              subPath: index.html
      volumes:
        - name: html-volume
          configMap:
            name: httpd-index-html

---
# Service HTTPD (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: simple-httpd-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: simple-httpd
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
